################################################################################
#  Autostart
#
#  exec-once = runs once when Hyprland starts
#  exec      = runs again on every config reload (use sparingly)
#
#  uwsm-managed sessions start portals and the polkit agent as systemd user
#  units, so this file stays short on purpose.
################################################################################

# ── session plumbing ──────────────────────────────────────────────────────────
# Tell systemd and D-Bus about the Wayland session so portals, screen sharing
# and xdg-open all find the right compositor.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Polkit agent — without this, anything asking for a password (Thunar mounting
# a disk, a GUI installer) silently fails.
exec-once = systemctl --user start hyprpolkitagent

# Unlock the login keyring so apps that store secrets work.
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets

# ── shell components ──────────────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = hypridle
exec-once = swayosd-server

# ── tray applets ──────────────────────────────────────────────────────────────
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = udiskie --tray

# ── clipboard history ─────────────────────────────────────────────────────────
# cliphist watches the clipboard; SUPER+X browses it.
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── directories used by keybinds ──────────────────────────────────────────────
exec-once = mkdir -p ~/Pictures/Screenshots

# ── cursor ────────────────────────────────────────────────────────────────────
# Set it explicitly so XWayland apps do not fall back to the X11 default cursor.
exec-once = hyprctl setcursor Adwaita 24
