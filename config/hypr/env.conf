################################################################################
#  Environment variables
#
#  These are exported into the Hyprland session. If you launch via uwsm they
#  also reach systemd user services, which is why portals behave correctly.
################################################################################

# ── toolkit backends ──────────────────────────────────────────────────────────
# Force native Wayland where it works; fall back to X11 automatically if not.
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# ── Qt ────────────────────────────────────────────────────────────────────────
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# ── XDG session identity ──────────────────────────────────────────────────────
# Portals and some apps key off these to pick the right behaviour.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ── cursor ────────────────────────────────────────────────────────────────────
# Set both: XCURSOR_* for XWayland/GTK, hyprcursor for native Hyprland surfaces.
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Adwaita
env = HYPRCURSOR_SIZE,24

# ── GPU ───────────────────────────────────────────────────────────────────────
# Vendor-specific variables (Vulkan ICD, VA-API driver) are NOT set here.
# The installer detects your hardware and writes them to gpu.conf, which
# hyprland.conf sources. Edit that file, or re-run install.sh, to change them.

# ── Firefox ───────────────────────────────────────────────────────────────────
env = MOZ_ENABLE_WAYLAND,1

# ── Electron ──────────────────────────────────────────────────────────────────
# Many Electron apps still default to XWayland; this nudges the newer ones over.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── theming ───────────────────────────────────────────────────────────────────
env = GTK_THEME,Adwaita:dark
