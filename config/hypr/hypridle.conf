################################################################################
#  hypridle — idle management
#
#  Dim at 2 minutes, blank at 3, lock at 5, suspend at 10.
#
#  Suspend applies everywhere, desktops included. That is a deliberate choice
#  rather than an oversight: a machine idle for ten minutes is not being used,
#  and waking one is quick. Comment the last listener out if a particular
#  machine should stay up.
################################################################################

general {
    # Run before the system sleeps, so you never resume to an unlocked screen.
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 2 minutes — dim the backlight as a warning that the screen is about to go.
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 3 minutes — displays off.
listener {
    timeout = 180
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 5 minutes — lock. After the screen is already dark, so it is not something
# you watch happen; before suspend, so a machine that never suspends is still
# locked.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 minutes — suspend.
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
