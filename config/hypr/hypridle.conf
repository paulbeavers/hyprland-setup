################################################################################
#  hypridle — idle management
#
#  Timings are deliberately conservative: dim at 5 min, lock at 10, screen off
#  at 15. Suspend is left commented out because it is the wrong default on a
#  desktop — uncomment it on a laptop.
################################################################################

general {
    # Run before the system sleeps, so you never resume to an unlocked screen.
    lock_cmd       = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 5 minutes — dim the backlight as a warning.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 10 minutes — lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 minutes — turn the displays off.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 30 minutes — suspend. Uncomment on a laptop.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
