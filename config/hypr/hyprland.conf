################################################################################
#  Hyprland — main configuration
#
#  This file defines the shared variables and wires the pieces together.
#  Edit the sourced files rather than this one:
#
#    monitors.conf   display layout          (generated by the installer)
#    env.conf        environment variables
#    theme.conf      colours, gaps, borders, animations
#    input.conf      keyboard, mouse, touchpad, gestures
#    keybinds.conf   every keyboard shortcut
#    rules.conf      per-window, per-layer and per-workspace rules
#    autostart.conf  programs started at login
#
#  Changes apply the moment you save — no restart needed.
#  Reference: https://wiki.hypr.land/Configuring/
################################################################################

# ── programs ──────────────────────────────────────────────────────────────────
# Defined FIRST, because Hyprland expands variables as it parses. Anything
# sourced below can use them; anything above this line cannot.
$terminal    = kitty
$fileManager = thunar
$menu        = wofi --show drun
$browser     = firefox
$editor      = kitty -e nvim

# ── sourced configuration ─────────────────────────────────────────────────────
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/env.conf
source = ~/.config/hypr/gpu.conf        # generated: vendor-specific GPU variables
source = ~/.config/hypr/theme.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/autostart.conf

# ── misc ──────────────────────────────────────────────────────────────────────
misc {
    # The Hyprland logo wallpaper and the "how to configure" banner.
    disable_hyprland_logo    = true
    disable_splash_rendering = true

    # Do not switch focus just because an app asked for it.
    focus_on_activate = false

    # Adaptive sync: 0 off, 1 on, 2 fullscreen-only.
    # 2 is the safe default — some apps flicker with VRR always on.
    vrr = 2

    # Middle-click paste on a titlebar is more often an accident than intent.
    middle_click_paste = false

    key_press_enables_dpms  = true
    mouse_move_enables_dpms = true
}

# ── xwayland ──────────────────────────────────────────────────────────────────
xwayland {
    # Let X11 apps render at native resolution instead of being upscaled and
    # blurred. The app has to handle HiDPI itself; if one looks tiny, set this
    # to false and let Hyprland scale it.
    force_zero_scaling = true
}

# ── render ────────────────────────────────────────────────────────────────────
render {
    # Hand the buffer straight to the display when one fullscreen window owns
    # the screen. Meaningful latency win for games and video.
    direct_scanout = 1
}

ecosystem {
    no_update_news = true
}
