################################################################################
#  hyprpaper — wallpaper daemon
#
#  Change wallpaper without restarting:
#      hyprctl hyprpaper reload , /path/to/image.png
################################################################################

preload = ~/Pictures/wallpapers/default.png

# An empty monitor name applies the wallpaper to every output.
wallpaper = , ~/Pictures/wallpapers/default.png

# Keep the image in memory after it is set. Turn off if you are tight on RAM.
splash = false
ipc = on
