################################################################################
#  hyprpaper — wallpaper daemon
#
#  SUPER+W opens a picker over this directory and rewrites the two lines
#  below. To change it by hand instead:
#
#      hyprctl hyprpaper wallpaper ",/path/to/image.png"
#
#  `wallpaper` is the only verb hyprpaper v0.8.4 accepts over hyprctl —
#  `preload`, `reload` and `unload` all come back "invalid hyprpaper request".
#  It loads the image itself, so no preload call is needed at runtime.
################################################################################

preload = ~/Pictures/wallpapers/starch-lattice-3840x2160.png

# An empty monitor name applies the wallpaper to every output.
wallpaper = , ~/Pictures/wallpapers/starch-lattice-3840x2160.png

# Keep the image in memory after it is set. Turn off if you are tight on RAM.
splash = false
ipc = on
