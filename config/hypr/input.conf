################################################################################
#  Input — keyboard, mouse, touchpad, gestures
################################################################################

input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    # Useful extras — uncomment what you want:
    #   caps:escape        Caps Lock acts as Escape
    #   compose:ralt       Right Alt becomes a compose key
    kb_options =
    kb_rules   =

    follow_mouse = 1
    # 0 = cursor never warps on focus change, 1 = warp to the new window.
    mouse_refocus = false

    # Repeat rate for held keys.
    repeat_rate  = 40
    repeat_delay = 400

    # -1.0 to 1.0. 0 is the raw hardware speed.
    sensitivity = 0
    accel_profile = flat

    numlock_by_default = true

    touchpad {
        natural_scroll        = true
        disable_while_typing  = true
        tap-to-click          = true
        drag_lock             = true
        scroll_factor         = 1.0
        clickfinger_behavior  = true
    }
}

# Move/resize a window by holding SUPER and dragging anywhere in it — no need
# to hit the border.
binds {
    # Pressing the workspace key you are already on sends you back to the
    # previous workspace.
    workspace_back_and_forth = false
    allow_workspace_cycles   = true
    # Scrolling past the last workspace does not wrap around.
    workspace_center_on      = 1
}


# Per-device overrides. Find names with: hyprctl devices
# device {
#     name = logitech-mx-master-3
#     sensitivity = -0.3
# }
################################################################################
#  Trackpad gestures
#
#  The old `gestures { workspace_swipe = true }` options were removed in
#  Hyprland 0.51. The syntax is now one line per gesture:
#
#      gesture = <fingers>, <direction>, [mod:MOD], [scale:N], <action>, [args]
#
#  directions: left right up down horizontal vertical swipe pinch
#              pinchin/zoomin pinchout/zoomout
#  actions:    workspace, move, resize, special <name>, close, float,
#              fullscreen, cursorZoom, scrollMove, dispatcher <name> <args>,
#              unset
#
#  These only fire on a touchpad, so they are harmless on a desktop.
################################################################################

# Three fingers sideways moves between workspaces.
gesture = 3, horizontal, workspace

# Four fingers up pulls the scratchpad down, four down dismisses it.
gesture = 4, up,   special, magic
gesture = 4, down, special, magic

# Pinch in with four fingers to toggle floating on the focused window.
gesture = 4, pinchin, float, toggle

# Tuning knobs for the swipe action above (these config values do still exist).
gestures {
    workspace_swipe_distance     = 300
    workspace_swipe_cancel_ratio = 0.4
    workspace_swipe_create_new   = false
    workspace_swipe_forever      = true
    workspace_swipe_direction_lock = true
}
