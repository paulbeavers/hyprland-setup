################################################################################
#  Keybinds
#
#  bind flags (append to the word "bind"):
#    e  repeats while held      (volume, resize)
#    l  works while locked      (media keys)
#    m  mouse binding
#    n  non-consuming: the app also receives the key
#    r  fires on release
#    o  long-press
#
#  Find a key's name with:  wev   (or `hyprctl devices` for a keyboard layout)
################################################################################

$mainMod = SUPER

# ── launching ─────────────────────────────────────────────────────────────────
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D,      exec, $menu
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, B,      exec, $browser
bind = $mainMod, N,      exec, $editor
bind = $mainMod SHIFT,  Return, exec, [float; size 1000 650; center] $terminal

# ── window management ─────────────────────────────────────────────────────────
bind = $mainMod, Q,      killactive
bind = $mainMod, V,      togglefloating
bind = $mainMod, P,      pseudo            # dwindle: fake-tile the window
bind = $mainMod, J,      layoutmsg, togglesplit   # dwindle: flip the split axis
bind = $mainMod, F,      fullscreen, 0     # true fullscreen
bind = $mainMod SHIFT, F, fullscreen, 1    # maximise within the gaps
bind = $mainMod, C,      centerwindow
bind = $mainMod SHIFT, P, pin              # keep on top across workspaces

# Exit Hyprland. Deliberately awkward so you cannot hit it by accident.
bind = $mainMod SHIFT, M, exit

# ── focus ─────────────────────────────────────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
# Vim keys do the same thing.
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
# (SUPER+J is togglesplit above; use the arrow key for "focus down".)

bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = $mainMod, Tab, focuscurrentorlast

# ── moving windows ────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ── resizing ──────────────────────────────────────────────────────────────────
# `binde` repeats while held.
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, up,    resizeactive,  0 -40
binde = $mainMod CTRL, down,  resizeactive,  0  40

# Drag with the mouse anywhere in the window — no need to grab a border.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── workspaces ────────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Send the focused window to a workspace (and follow it).
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Send it there without switching (silent).
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5

# Relative workspace movement. `m` = monitor-relative, so this stays on screen.
bind = $mainMod, bracketleft,  workspace, m-1
bind = $mainMod, bracketright, workspace, m+1
bind = $mainMod, mouse_down, workspace, m+1
bind = $mainMod, mouse_up,   workspace, m-1

# Scratchpad — a workspace that floats over whatever you are doing.
bind = $mainMod, S,        togglespecialworkspace, magic
bind = $mainMod ALT, S,    movetoworkspace, special:magic

# ── monitors ──────────────────────────────────────────────────────────────────
bind = $mainMod, comma,  focusmonitor, -1
bind = $mainMod, period, focusmonitor, +1
bind = $mainMod SHIFT, comma,  movecurrentworkspacetomonitor, -1
bind = $mainMod SHIFT, period, movecurrentworkspacetomonitor, +1

# ── grouping (tabbed windows) ─────────────────────────────────────────────────
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, moveoutofgroup
bind = ALT, bracketleft,  changegroupactive, b
bind = ALT, bracketright, changegroupactive, f

# ── screenshots ───────────────────────────────────────────────────────────────
# Region → annotate → save/copy.
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp -d)" - | swappy -f -
# Region straight to clipboard.
bind = , Print, exec, grim -g "$(slurp -d)" - | wl-copy
# Whole focused monitor to ~/Pictures/Screenshots.
bind = SHIFT, Print, exec, grim -o "$(hyprctl activeworkspace -j | jq -r .monitor)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Colour picker — copies the hex to the clipboard.
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# ── clipboard history ─────────────────────────────────────────────────────────
bind = $mainMod, X, exec, cliphist list | wofi --dmenu --width 700 --height 400 | cliphist decode | wl-copy

# ── session ───────────────────────────────────────────────────────────────────
bind = $mainMod, Escape,  exec, hyprlock
bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/powermenu.sh
bind = $mainMod, slash,   exec, ~/.config/hypr/scripts/keybinds.sh
bind = $mainMod, W,       exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/theme.sh

# Reload waybar without restarting the session.
bind = $mainMod SHIFT, R, exec, killall -SIGUSR2 waybar

# ── media and hardware keys ───────────────────────────────────────────────────
# `l` = these still work on the lock screen. `e` = repeat while held.
bindel = , XF86AudioRaiseVolume,  exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume,  exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bindl  = , XF86AudioMicMute,      exec, swayosd-client --input-volume mute-toggle
bindel = , XF86MonBrightnessUp,   exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# ── submaps ───────────────────────────────────────────────────────────────────
# A "resize mode": press SUPER+R, resize with hjkl, Escape to leave.
bind = $mainMod, R, submap, resize
submap = resize
binde = , h, resizeactive, -40 0
binde = , l, resizeactive,  40 0
binde = , k, resizeactive,  0 -40
binde = , j, resizeactive,  0  40
binde = , left,  resizeactive, -40 0
binde = , right, resizeactive,  40 0
binde = , up,    resizeactive,  0 -40
binde = , down,  resizeactive,  0  40
bind  = , escape, submap, reset
bind  = , Return, submap, reset
submap = reset
