################################################################################
#  Window, layer and workspace rules
#
#  IMPORTANT — the rule syntax changed in Hyprland 0.56. `windowrulev2` is now
#  a hard error. The current form is a comma-separated list where every field
#  is "<name> <value>":
#
#      windowrule = match:<property> <value>, <effect> <value>
#
#  match properties: class title initial_class initial_title float tag xwayland
#                    fullscreen pin focus group modal workspace content
#                    xdg_tag namespace fullscreen_state_internal
#                    fullscreen_state_client
#
#  effects: float tile fullscreen maximize move size center pseudo monitor
#           workspace pin group opacity rounding border_size border_color
#           no_anim no_blur no_shadow no_dim no_focus no_initial_focus
#           opaque immediate xray idle_inhibit suppress_event tag
#           min_size max_size keep_aspect_ratio render_unfocused
#           no_screen_share stay_focused dim_around decorate allows_input …
#
#  Not every effect is a boolean. Notably `idle_inhibit` takes a MODE:
#      none | always | focus | fullscreen
#  and `opacity` takes 1-2 floats, `size`/`move` a vec2.
#
#  Boolean effects still need an explicit value: `float true`, not `float`.
#  Find a window's class/title with:  hyprctl clients
################################################################################

# ── global defaults ───────────────────────────────────────────────────────────
# Nothing global by default — add rules here only when you mean them to apply
# to every window, since a bad match here breaks everything at once.

# ── float the things that should float ────────────────────────────────────────
windowrule = match:title ^(Open File|Save File|Save As|Open Folder|Select a File)$, float true, center true
windowrule = match:class ^(pavucontrol|blueman-manager|nm-connection-editor)$, float true, size 900 600, center true
windowrule = match:class ^(org.gnome.Calculator|galculator)$, float true, size 400 550
windowrule = match:class ^(nwg-look|nwg-displays)$, float true, center true
windowrule = match:class ^(thunar)$, match:title ^(File Operation Progress)$, float true, center true
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float true, center true
windowrule = match:class ^(imv|mpv)$, float true, size 1280 720, center true

# Picture-in-picture: float, pin above everything, park it bottom-right.
windowrule = match:title ^(Picture-in-Picture)$, float true, pin true, size 640 360, move 100%-660 100%-420

# ── steam ─────────────────────────────────────────────────────────────────────
# Steam's notification and friends-list windows tile horribly by default.
windowrule = match:class ^(steam)$, match:title ^(Friends List|Steam Settings)$, float true, center true
windowrule = match:class ^(steam)$, match:title ^()$, no_focus true

# ── games ─────────────────────────────────────────────────────────────────────
# `immediate` allows tearing, which cuts input latency in fullscreen games.
# It only applies where `general:allow_tearing` is on (it is, in theme.conf).
windowrule = match:class ^(steam_app_\d+)$, immediate true, no_anim true, idle_inhibit focus
windowrule = match:class ^(gamescope)$,     immediate true, no_anim true, idle_inhibit focus

# Stop the screen blanking during fullscreen video or games. The mode is the
# condition, so this needs no match: clause.
windowrule = match:class .*, idle_inhibit fullscreen

# ── transparency ──────────────────────────────────────────────────────────────
# Terminals and the file manager look good slightly see-through; nothing else
# does, so keep it narrow.
windowrule = match:class ^(kitty)$,  opacity 0.94 0.88
windowrule = match:class ^(thunar)$, opacity 0.97 0.92

# Never make video or images translucent — it ruins them.
windowrule = match:class ^(mpv|imv)$, opacity 1.0 1.0

# ── privacy ───────────────────────────────────────────────────────────────────
# Blank these out in screen shares rather than leaking them.
windowrule = match:class ^(1Password|Bitwarden|KeePassXC)$, no_screen_share true
windowrule = match:class ^(1Password|Bitwarden|KeePassXC)$, float true, center true

# ── layer rules ───────────────────────────────────────────────────────────────
# Layers are the shell surfaces: the bar, the launcher, notifications.
# effects: blur, blur_popups, ignore_alpha, xray, dim_around, no_anim,
#          above_lock, order, animation, no_screen_share
layerrule = match:namespace ^(waybar)$, blur true, ignore_alpha 0.2
layerrule = match:namespace ^(wofi)$,   blur true, ignore_alpha 0.3
layerrule = match:namespace ^(notifications)$, blur true, ignore_alpha 0.3
layerrule = match:namespace ^(hyprpicker)$,    no_anim true

# ── workspace rules ───────────────────────────────────────────────────────────
# Workspaces 1-5 always exist, so the bar shows a stable row of numbers.
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

# The scratchpad gets a bit of breathing room.
workspace = special:magic, on-created-empty:$terminal, gapsout:60

# ── helper terminals ──────────────────────────────────────────────────────────
# Waybar's cpu/memory/network modules open btop and nmtui with this class.
windowrule = match:class ^(floating-term)$, float true, size 1100 700, center true
