################################################################################
#  Appearance — colours, spacing, borders, blur, animations
#
#  Palette: Catppuccin Mocha. Change the colour variables below and everything
#  downstream (borders, hyprlock) follows.
################################################################################

# ── palette ───────────────────────────────────────────────────────────────────
$base     = rgb(1e1e2e)
$mantle   = rgb(181825)
$crust    = rgb(11111b)
$text     = rgb(cdd6f4)
$subtext  = rgb(a6adc8)
$surface  = rgb(313244)
$overlay  = rgb(6c7086)
$blue     = rgb(89b4fa)
$lavender = rgb(b4befe)
$sapphire = rgb(74c7ec)
$mauve    = rgb(cba6f7)
$red      = rgb(f38ba8)
$peach    = rgb(fab387)
$green    = rgb(a6e3a1)

# ── layout ────────────────────────────────────────────────────────────────────
general {
    gaps_in     = 5
    gaps_out    = 10
    border_size = 2

    # Active border is a gradient; 45deg makes it read as a light source.
    col.active_border   = $mauve $blue 45deg
    col.inactive_border = $surface

    # Click a window to focus it; do not also start dragging.
    resize_on_border = true
    hover_icon_on_border = true

    layout = dwindle

    # Tearing is only allowed for windows that explicitly ask (see rules.conf).
    allow_tearing = true
}

decoration {
    rounding = 10
    rounding_power = 2.0

    active_opacity   = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(11111baa)
        offset = 0 4
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        # Only blur what is actually behind the window — cheaper and cleaner.
        new_optimizations = true
        ignore_opacity = true
        xray = false
        noise = 0.012
        contrast = 1.0
        brightness = 0.85
        popups = true
        popups_ignorealpha = 0.4
    }
}

# ── animations ────────────────────────────────────────────────────────────────
# Tuned to feel quick rather than showy: nothing here runs longer than ~250ms.
animations {
    enabled = true

    bezier = easeOutQuint,  0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,        0,    0,    1,    1
    bezier = almostLinear,  0.5,  0.5,  0.75, 1.0
    bezier = quick,         0.15, 0,    0.1,  1

    animation = global,        1, 8,   default
    animation = border,        1, 5,   easeOutQuint
    animation = windows,       1, 4,   easeOutQuint
    animation = windowsIn,     1, 4,   easeOutQuint, popin 87%
    animation = windowsOut,    1, 2,   linear,       popin 87%
    animation = fadeIn,        1, 2,   almostLinear
    animation = fadeOut,       1, 1.5, almostLinear
    animation = fade,          1, 3,   quick
    animation = layers,        1, 3,   easeOutQuint
    animation = layersIn,      1, 3,   easeOutQuint, fade
    animation = layersOut,     1, 1.5, linear,       fade
    animation = workspaces,    1, 2,   almostLinear, fade
    animation = workspacesIn,  1, 2,   almostLinear, fade
    animation = workspacesOut, 1, 2,   almostLinear, fade
    animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
}

# ── layouts ───────────────────────────────────────────────────────────────────
dwindle {
    # Keep a split's direction once chosen instead of re-deciding as the tree
    # changes — layouts stay where you put them.
    preserve_split = true
    smart_split    = false
    smart_resizing = true

    # On an ultrawide, split side-by-side until windows get narrow.
    force_split = 2
}

master {
    new_status     = master
    new_on_top     = false
    mfact          = 0.5
    orientation    = left
    smart_resizing = true
}

# ── group (tabbed windows) ────────────────────────────────────────────────────
group {
    col.border_active   = $mauve $blue 45deg
    col.border_inactive = $surface

    groupbar {
        enabled     = true
        font_family = JetBrainsMono Nerd Font
        font_size   = 11
        height      = 16
        gradients   = true
        col.active   = $mauve
        col.inactive = $surface
        text_color   = $text
    }
}
