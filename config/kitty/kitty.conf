# kitty — terminal
# Reload config in place: ctrl+shift+F5   ·   Full docs: kitty +kitten docs

# ── font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5

# Slightly tighter lines read better on a high-DPI panel.
adjust_line_height  0
modify_font cell_height 105%

# ── window ────────────────────────────────────────────────────────────────────
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# Hyprland already draws borders and does the blur; let it show through.
background_opacity 0.95
dynamic_background_opacity yes

# ── cursor ────────────────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0
# Stop the cursor animating across the screen — it reads as lag.
cursor_trail 0

# ── scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 128

# ── bell ──────────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── tabs ──────────────────────────────────────────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# ── performance ───────────────────────────────────────────────────────────────
# 100ms repaint delay is kitty's default; 8ms tracks a 120Hz display instead.
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ── keybinds ──────────────────────────────────────────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window
map ctrl+equal  change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map ctrl+0      change_font_size all 0

# ── Catppuccin Mocha ──────────────────────────────────────────────────────────
foreground            #cdd6f4
background            #1e1e2e
selection_foreground  #1e1e2e
selection_background  #f5e0dc

cursor                #f5e0dc
cursor_text_color     #1e1e2e

url_color             #f5e0dc
active_border_color   #b4befe
inactive_border_color #6c7086
bell_border_color     #f9e2af

